spring:
  application:
    name: api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}
    username: ${DB_USER:portfolio}
    password: ${DB_PASSWORD:portfolio}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

app:
  profile:
    slug: ${PROFILE_SLUG:default}
  admin:
    enabled: ${ADMIN_ENABLED:false}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info