# Production-like stack for local testing: database + API + web, admin OFF.
# Run with: docker compose -f docker-compose.full.yml -p portfolio-full up --build -d
# (drop -d to stream logs in the terminal; Ctrl+C then stops the containers)
# Uses its own ports (API 8081, web 3001) and its own database volume, so it
# does not interfere with the normal dev setup.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    volumes:
      - postgres_full_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: apps/api
    environment:
      DB_HOST: postgres
      DB_NAME: portfolio
      DB_USER: portfolio
      DB_PASSWORD: portfolio
      PROFILE_SLUG: default
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "3001:8080"

volumes:
  postgres_full_data:
