name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-web:
    name: Lint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=web

  lint-api:
    name: Lint (api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # TODO: swap this for a real Checkstyle/Spotless gate once static
      # analysis is wired up (code-quality step). For now this only verifies
      # the project compiles, which is the closest thing to "lint" we have.
      - name: Compile (placeholder for lint)
        run: mvn -B -q compile
